[workspace]
resolver = "3"
members = ["crates/groxel", "crates/groxel-light", "crates/groxel-render", "crates/groxel-body", "crates/groxel-app", "crates/groxel-walk", "experiments"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/no-way-labs/groxel"

[profile.dev]
opt-level = 1

[profile.release]
debug = 1
